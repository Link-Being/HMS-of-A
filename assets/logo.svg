<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Tlo zaokraglone ciemnoniebieskie -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#0a1526" stroke="#00d4ff" stroke-width="6" />
  <!-- Pierscien celownika -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="#00d4ff" stroke-width="7" />
  <!-- Ramiona celownika -->
  <line x1="64" y1="28" x2="64" y2="100" stroke="#00d4ff" stroke-width="7" stroke-linecap="round" />
  <line x1="28" y1="64" x2="100" y2="64" stroke="#00d4ff" stroke-width="7" stroke-linecap="round" />
  <!-- Centralny punkt -->
  <circle cx="64" cy="64" r="14" fill="#00d4ff" />
</svg>
